- title: Projects
  type: time_table
  contents:
    - title: Surface Energy of Sucrose at Modified Particle Sizes
      year: 2026
      description:
        - "Characterised surface energy heterogeneity across three sucrose fractions produced by two processing routes, using iGC-SEA with Dorris-Gray and Peak COM analysis, alongside PXRD, SEM and BET surface area."
        - "Found that processing route governs surface energy character more strongly than particle size alone, with no direct relationship between BET specific surface area and surface energy, contrary to the expected trend."
        - "Presented at the Analytical Research Forum 2026 and subsequently adopted as a Resolian marketing resource."

